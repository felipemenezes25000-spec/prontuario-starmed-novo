name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    name: API — testes, build e smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: starmed_test
          POSTGRES_USER: starmed
          POSTGRES_PASSWORD: starmed_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starmed -d starmed_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Credenciais EXCLUSIVAMENTE sintéticas e exclusivas do CI.
      # Nunca reutilizar estas variáveis fora desta execução.
      DATABASE_URL: postgres://starmed:starmed_ci@127.0.0.1:5432/starmed_test
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef0123
      AUTH_ISSUER: starmed-ci
      AUTH_AUDIENCE: starmed-api-ci
      WEB_ORIGIN: http://localhost:5173
      API_PORT: "3001"
      STARMED_TEST_DB: "true"
      BOOTSTRAP_ORGANIZATION: StarMed CI
      BOOTSTRAP_ADMIN_EMAIL: ci-admin@starmed.invalid
      BOOTSTRAP_ADMIN_PASSWORD: Ci-Only-Admin-P4ssw0rd-2026
      STARMED_SMOKE_ADMIN_EMAIL: ci-admin@starmed.invalid
      STARMED_SMOKE_ADMIN_PASSWORD: Ci-Only-Admin-P4ssw0rd-2026
      STARMED_SMOKE_API_URL: http://127.0.0.1:3001
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências (reproduzível, lockfile)
        run: npm ci
      - name: Testes de domínio (API)
        run: npm test
      - name: Typecheck e build (API + Web)
        run: npm run build
      - name: Schema e migrações versionadas (fail-closed)
        run: npm run migrate -w @starmed/api
      - name: Provisionar credencial do papel de aplicação (não-owner)
        run: node scripts/db/setup-app-role.mjs
        env:
          STARMED_APP_ROLE_PASSWORD: app-ci-only-not-prod-2026
      - name: Bootstrap de organização e admin sintéticos
        run: npm run bootstrap -w @starmed/api
      - name: Iniciar API em banco descartável e aguardar /health
        # A API roda como starmed_app (papel NÃO-owner): é esse caminho que
        # exercita as policies de RLS (018) — não o dono superusuário.
        env:
          DATABASE_URL: postgres://starmed_app:app-ci-only-not-prod-2026@127.0.0.1:5432/starmed_test
        run: |
          set -euo pipefail
          nohup npm run start -w @starmed/api > /tmp/api.log 2>&1 &
          api_pid=$!
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/health >/dev/null 2>&1; then
              echo "API saudável após ${i} tentativa(s)"
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              echo "API encerrou antes de responder /health"
              cat /tmp/api.log
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3001/health
      - name: Smoke — CRUD, notas imutáveis, FHIR, agenda, tenant
        run: npm run smoke -w @starmed/api
      - name: Smoke — MFA TOTP, step-up e recuperação
        run: npm run smoke:mfa -w @starmed/api
      - name: Drill cross-tenant — 2 orgs pela API (RLS real)
        run: >-
          node scripts/rls/cross-tenant-drill.mjs
          --api http://127.0.0.1:3001
          --url "$DATABASE_URL"
          --email ci-admin@starmed.invalid
          --password Ci-Only-Admin-P4ssw0rd-2026
      - name: Logs da API (diagnóstico, sempre)
        if: always()
        run: cat /tmp/api.log 2>/dev/null || true

  e2e:
    name: E2E — Playwright (3 jornadas)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: starmed_e2e
          POSTGRES_USER: starmed
          POSTGRES_PASSWORD: starmed_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U starmed -d starmed_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Credenciais EXCLUSIVAMENTE sintéticas e exclusivas deste job (literal já
      # conhecido do job api — nada real é assinado com ele).
      DATABASE_URL: postgres://starmed:starmed_e2e@127.0.0.1:5432/starmed_e2e
      AUTH_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef0123
      AUTH_ISSUER: starmed-ci
      AUTH_AUDIENCE: starmed-api-ci
      STARMED_TEST_DB: "true"
      BOOTSTRAP_ORGANIZATION: StarMed E2E
      BOOTSTRAP_ADMIN_EMAIL: e2e-admin@starmed.invalid
      BOOTSTRAP_ADMIN_PASSWORD: E2e-Only-Admin-P4ssw0rd-2026
      E2E_ADMIN_EMAIL: e2e-admin@starmed.invalid
      E2E_ADMIN_PASSWORD: E2e-Only-Admin-P4ssw0rd-2026
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar Chromium do Playwright (+ dependências de sistema)
        run: npx playwright install --with-deps chromium
      # O runner faz tudo: CA de teste (trust store injetável → PAdES positivo),
      # migrações, bootstrap, build, API (:3001), web (:5174) e as 3 jornadas.
      # Este job não exercita RLS (é papel dono): isolamento é do job `api` + drill.
      - name: E2E — login+MFA, prescrição PAdES, break-glass
        run: node scripts/e2e/run-e2e.mjs
      - name: Artefatos Playwright (diagnóstico de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e
          path: test-results/
          if-no-files-found: ignore

  web:
    name: Web — typecheck e bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web
        run: npm run build -w @starmed/web

  sca:
    name: SCA — dependências vulneráveis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Política: vulnerabilidade CRÍTICA bloqueia o merge (fail-closed).
      # Altas são emitidas como relatório para triagem com dono e data.
      - name: npm audit (bloqueia críticas)
        run: npm audit --audit-level=critical
      - name: Gerar SBOM CycloneDX e inventário de dependências
        run: node scripts/security/generate-sbom.mjs
      - name: Publicar SBOM (evidência vinculada ao run)
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: artifacts/security/
          if-no-files-found: error

  interop:
    name: Interop — TISS XSD (ANS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gerar lote TISS sintético (dados fictícios)
        run: npx tsx scripts/tiss/ci-fixture.ts tiss-ci.xml
      - name: Validar contra tissV4_01_00.xsd (deve passar)
        run: pwsh scripts/tiss/validate-tiss.ps1 -Xml tiss-ci.xml
      - name: Prova de gate — XML corrompido deve ser REJEITADO
        shell: pwsh
        run: |
          $xml = Get-Content tiss-ci.xml -Raw
          $xml = $xml -replace '<tiss:tipoTransacao>[^<]+</tiss:tipoTransacao>', ''
          Set-Content -Path tiss-ci-invalid.xml -Value $xml -Encoding utf8
          pwsh scripts/tiss/validate-tiss.ps1 -Xml tiss-ci-invalid.xml
          $validatorExit = $LASTEXITCODE
          if ($validatorExit -eq 0) { Write-Error 'O validador aceitou um XML inválido — gate inoperante'; exit 1 }
          Write-Output 'Gate negativo OK: XML inválido foi rejeitado pelo XSD da ANS.'
          # Encerra explícito: o wrapper do pwsh propaga $LASTEXITCODE do validador
          # (1, esperado) se não for zerado aqui.
          exit 0

  interop-fhir:
    name: Interop — validador FHIR oficial (fixtures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # JAR oficial HL7 (7.0.2) baixado uma vez e verificado por sha256 PUBLISHED
      # (o script falha fechada se o hash divergir); pacote FHIR core fica em ~/.fhir.
      - uses: actions/cache@v4
        with:
          path: |
            .cache/fhir-validator
            ~/.fhir
          key: fhir-validator-7.0.2-e3e50f06
      - name: Validar fixtures com o validador oficial (positivo + gate negativo)
        run: node scripts/rnds/validate-official.mjs

  security:
    name: Gitleaks — varredura de segredos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Gate real: sem continue-on-error. Um segredo no histórico derruba o job.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # O CLI só auto-descobre .gitleaks.toml na raiz; aqui ele está em .github/.
          GITLEAKS_CONFIG: .github/gitleaks.toml
