services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: starmed
      POSTGRES_USER: starmed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local development}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # O schema NÃO é aplicado via initdb: a única fonte de verdade é o runner
      # versionado `npm run migrate` (database/schema.sql + 002..014, com
      # checksums em schema_migrations). Assim banco local e CI convergem.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starmed -d starmed"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  pgdata:
