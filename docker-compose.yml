services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: starmed
      POSTGRES_USER: starmed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local development}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/002_unique_login.sql:/docker-entrypoint-initdb.d/002_unique_login.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starmed -d starmed"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  pgdata:
